<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nyay Sahayak — AI legal help for everyday problems in India</title>
  <meta name="description" content="Talk to an AI legal assistant in Hindi or English. Understand your rights, build your case, draft legal notices and complaints, and practise negotiating — free.">
  <meta name="theme-color" content="#16213d">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Noto+Sans:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script>
    // apply theme before paint (no flash)
    try { const s = JSON.parse(localStorage.getItem('nyay.v1.settings') || '{}');
      const dark = s.theme === 'dark' || (s.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'; } catch {}
  </script>
</head>
<body>
<div class="app" id="app">
  <!-- ============ Sidebar: chat history ============ -->
  <aside class="sidebar" id="sidebar" aria-label="Chat history">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="var(--accent)"/><g stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M20 9.5v19.5M13.5 29h13M11 13.5h18"/><path d="M11 13.5 7.5 21h7zM29 13.5 25.5 21h7z" stroke-width="1.6"/></g><path d="M7.5 21a3.5 2.2 0 0 0 7 0zM25.5 21a3.5 2.2 0 0 0 7 0z" fill="#fff"/><circle cx="20" cy="9" r="1.8" fill="#fff"/></svg>
      <div><b>Nyay Sahayak</b><span class="dev">न्याय सहायक</span></div>
      <button class="icon mobile-only" id="closeSidebar" data-icon="x" aria-label="Close"></button>
    </div>
    <button class="btn primary block" id="newChat"><i data-icon="plus"></i><span data-t="newChat"></span></button>
    <div class="search"><i data-icon="search"></i><input id="chatSearch" type="search" autocomplete="off"></div>
    <nav class="chat-list" id="chatList"></nav>
    <div class="side-foot">
      <div class="seg" id="langSeg" role="radiogroup" aria-label="Language">
        <button data-lang="auto">Auto</button><button data-lang="en">EN</button><button data-lang="hi">हिं</button>
      </div>
      <button class="icon" id="themeBtn" aria-label="Toggle theme" data-icon="moon"></button>
      <button class="icon" id="settingsBtn" aria-label="Settings" data-icon="sliders"></button>
    </div>
  </aside>

  <!-- ============ Main conversation ============ -->
  <main class="main">
    <header class="topbar">
      <button class="icon mobile-only" id="menuBtn" data-icon="menu" aria-label="Chats"></button>
      <div class="title-wrap">
        <h1 id="chatTitle" title="Click to rename"></h1>
        <button class="pill ghost" id="memoryBtn"><i data-icon="brain"></i><span data-t="memory"></span></button>
      </div>
      <div class="top-actions">
        <button class="icon" id="speakToggle" data-icon="volumeX" aria-label="Read answers aloud"></button>
        <button class="btn soft" id="caseBtn"><i data-icon="folder"></i><span class="hide-sm" data-t="caseFile"></span><span class="badge" id="caseCount" hidden></span></button>
      </div>
      <div class="memory-pop" id="memoryPop" hidden></div>
    </header>

    <section class="thread" id="thread" aria-live="polite"></section>

    <footer class="composer-wrap">
      <div class="modes" id="modes" role="tablist"></div>
      <div class="mode-row" id="modeRow" hidden></div>
      <div class="composer" id="composer">
        <div class="attach-chip" id="attachChip" hidden></div>
        <textarea id="input" rows="1" aria-label="Message"></textarea>
        <div class="composer-actions">
          <label class="icon" id="attachBtn" title="Attach a notice (PDF / photo)"><i data-icon="clip"></i><input type="file" id="fileInput" accept=".pdf,image/*,.txt" hidden></label>
          <button class="icon mic" id="micBtn" data-icon="mic" aria-label="Speak"></button>
          <button class="send" id="sendBtn" data-icon="send" aria-label="Send"></button>
        </div>
      </div>
      <p class="disclaimer"><i data-icon="shield"></i><span data-t="disclaimer"></span></p>
    </footer>
  </main>

  <!-- ============ Case file ============ -->
  <aside class="casepanel" id="casePanel" aria-label="Case file"></aside>
</div>
<div class="scrim" id="scrim"></div>

<dialog id="settingsDlg">
  <form method="dialog">
    <h3 data-t="settings"></h3>
    <label class="switch"><input type="checkbox" id="setAutoSpeak"><span data-t="autoSpeak"></span></label>
    <label class="switch"><input type="checkbox" id="setHandsFree"><span data-t="handsFree"></span></label>
    <div class="dlg-row">
      <button type="button" class="btn soft" id="exportBtn"><i data-icon="download"></i><span data-t="export"></span></button>
      <label class="btn soft"><i data-icon="upload"></i><span data-t="import"></span><input type="file" id="importInput" accept="application/json" hidden></label>
    </div>
    <p class="muted small" id="healthInfo"></p>
    <button class="btn primary" value="close">OK</button>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
